<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>SIMPE - Notas</title>
</head>

<body>
    <div class="header">
        <h1>📝 SIMPE - Notas</h1>
        <p>RF003 - Lançamento e consulta de notas</p>
    </div>
    <div class="menu">
        <a href="index.html">📊 Dashboard</a>
        <a href="alertas.html">🚨 Alertas</a>
        <a href="relatorios.html">📋 Relatórios</a>
        <a href="frequencia.html">📅 Frequência</a>
        <a href="notas.html">📝 Notas</a>
        <a href="intervencoes.html">🤝 Intervenções</a>
        <a href="alunos.html">👨‍🎓 Alunos</a>
    </div>
    <div class="card">
        <h3>➕ Lançar nota</h3>
        <form id="formNota" class="form-grid">
            <select name="aluno_id" id="aluno_id" required></select>
            <select name="disciplina_id" id="disciplina_id" required></select>
            <input name="valor" type="number" min="0" max="10" step="0.1" placeholder="Nota" required>
            <input name="periodo" placeholder="Período">
            <button type="submit">Salvar nota</button>
        </form>
    </div>
    <div class="card">
        <h3>📋 INFO-01 - Redes</h3>
        <table id="tabelaNotas">
            <thead><tr>
                <th>Aluno</th>
                <th>Disciplina</th><th>Nota</th>
                <th>Período</th>
                <th>Média</th>
                <th>Status</th>
            </tr></thead>
            <tbody></tbody>
        </table>
    </div>
    <script src="../js/app.js"></script>
</body>

</html>
