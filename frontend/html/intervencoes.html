<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>SIMPE - Intervenções</title>
</head>

<body>
    <div class="header">
        <h1>🤝 SIMPE - Intervenções</h1>
        <p>RF007 - Registro de intervenções</p>
    </div>
    <div class="menu">
        <a href="index.html">📊 Dashboard</a>
        <a href="alertas.html">🚨 Alertas</a>
        <a href="relatorios.html">📋 Relatórios</a>
        <a href="frequencia.html">📅 Frequência</a>
        <a href="notas.html">📝 Notas</a>
        <a href="intervencoes.html">🤝 Intervenções</a>
        <a href="alunos.html">👨‍🎓 Alunos</a>
    </div>
    <div class="card">
        <h3>➕ Registrar intervenção</h3>
        <form id="formIntervencao" class="form-grid">
            <select name="aluno_id" id="aluno_id" required></select>
            <select name="usuario_id" id="usuario_id" required></select>
            <input name="data" type="date" required>
            <input name="descricao" placeholder="Descrição da intervenção" required>
            <select name="status"><option value="planejada">Planejada</option><option value="em andamento">Em andamento</option><option value="concluída">Concluída</option></select>
            <input name="resultado_esperado" placeholder="Resultado esperado">
            <button type="submit">Salvar intervenção</button>
        </form>
    </div>
    <div class="card">
        <h3>📋 Histórico</h3>
        <table id="tabelaIntervencoes">
            <tr>
                <th>Data</th>
                <th>Aluno</th>
                <th>Descrição</th>
                <th>Responsável</th>
                <th>Status</th>
            </tr>
            <tbody></tbody>
        </table>
    </div>
    <script src="../js/app.js"></script>
</body>

</html>
