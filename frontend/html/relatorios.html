<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>SIMPE - Relatórios</title>
</head>

<body>

    <div class="header">
        <h1>📋 SIMPE - Relatórios de Evasão</h1>
        <p>RF006 - Relatório mensal consolidado</p>
    </div>
    <div class="menu">
        <a href="index.html">📊 Dashboard</a>
        <a href="alertas.html">🚨 Alertas</a>
        <a href="relatorios.html">📋 Relatórios</a>
        <a href="frequencia.html">📅 Frequência</a>
        <a href="notas.html">📝 Notas</a>
        <a href="intervencoes.html">🤝 Intervenções</a>
        <a href="alunos.html">👨‍🎓 Alunos</a>
    </div>

    <div class="card">
        <h3>🔍 Filtrar Relatório</h3>
        <select id="filtroTurma" onchange="exibirRelatorio()">
            <option value="todas">Todas as Turmas</option>
        </select>
    </div>

    <div class="card">
        <h3>📊 Relatório Consolidado - Setembro/2026</h3>
        <table>
            <thead>
                <tr>
                    <th>Turma</th>
                    <th>Total Alunos</th>
                    <th>Faltas</th>
                    <th>Média</th>
                    <th>Notas Baixas</th>
                    <th>Em Risco</th>
                    <th>Nível</th>
                </tr>
            </thead>
            <tbody id="corpoRelatorio"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>📊 Resumo Geral</h3>
        <div id="resumoGeral"></div>
    </div>

    <div class="card">
        <button class="btn" onclick="window.print()">📥 Exportar PDF</button>
        <button class="btn" onclick="exportarCSV()">📥 Exportar CSV</button>
    </div>

    <script src="../js/app.js"></script>
</body>

</html>
